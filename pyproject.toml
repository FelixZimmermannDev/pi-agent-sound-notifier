[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analysis-coach"
version = "0.2.0"
description = "A live analysis coach for permitted local chess practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11,<2",
    "Flask>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
chess-coach = "chess_analysis_coach.cli:main"

[tool.setuptools.package-data]
chess_analysis_coach = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-overlay"
version = "0.2.0"
description = "Revision-safe desktop overlay for permitted local Chess Analysis Coach use"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess-analysis-coach==0.6.0",
    "dxcam>=0.3,<1",
    "numpy>=2,<3",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.gui-scripts]
chess-overlay = "chess_overlay.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
